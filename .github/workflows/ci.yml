name: CI

on:
  # Branches only. A tag push belongs to the release pipeline, which calls this
  # workflow itself; an unfiltered `push` would run every check twice.
  push:
    branches: ["**"]
  pull_request:
  # The release pipeline calls this so a tag re-runs every check from one
  # definition. Duplicating the jobs there would guarantee they drift.
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever the ref.
        type: boolean
        default: false

# Public repository: grant nothing by default, and let a fork PR run every
# hermetic job without needing a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  # ---- cheap, runs on every push -----------------------------------------

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # Standard library only, so neither of these needs a dependency install.
      - run: python scripts/verify_provenance.py
      # The docstrings memco.agent reads are generated from the tool manifest.
      # Drift here hands a model copy the service did not write.
      - run: python scripts/sync_tool_docs.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy

  test:
    name: Test (3.12)
    # Pinned explicitly: without --python, uv resolves the interpreter from
    # python/.python-version (the supported floor), so this job would silently
    # duplicate the matrix's 3.10 run and leave 3.12 untested.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev --python 3.12
      # Coverage runs on this job only: the matrix jobs prove the suite passes on
      # every supported interpreter, and measuring the same lines four times
      # would say nothing new. `fail_under` in pyproject.toml is the gate — this
      # step fails the build below the floor, so the badge cannot go stale.
      - run: uv run --python 3.12 pytest -q --cov --cov-report=term --cov-report=xml
      - name: Report coverage
        if: always()
        run: |
          uv run --python 3.12 python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          report = pathlib.Path("coverage.xml")
          if not report.exists():
              print("### Coverage\n\nNo report produced — the suite did not finish.")
              raise SystemExit
          root = ET.parse(report).getroot()
          rate = float(root.get("line-rate", 0)) * 100
          branch = float(root.get("branch-rate", 0)) * 100
          print(f"### Coverage\n\n**{rate:.1f}%** of lines, **{branch:.1f}%** of branches.\n")
          print("| Module | Lines |\n|---|---|")
          for cls in sorted(root.iter("class"), key=lambda c: float(c.get("line-rate", 0))):
              print(f"| `{cls.get('filename')}` | {float(cls.get('line-rate', 0)) * 100:.0f}% |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-python
          path: python/coverage.xml
          retention-days: 14

  # ---- longer: pull requests, main, and releases -------------------------

  test-matrix:
    name: Test (${{ matrix.python }})
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]  # 3.12 is covered by the `test` job
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q

  build:
    name: Build and install
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Not `--wheel`: plain `uv build` writes the sdist first and then builds
      # the wheel *from that sdist*, so every check below runs against a wheel
      # that came through the source distribution. That is what proves the sdist
      # is whole: a requirements input or a generated module missing from it
      # fails here rather than in a consumer's install from source.
      - name: Build the sdist, and the wheel from it
        run: uv build

      # Validated with `packaging`, the same parser PyPI's own index uses.
      # `twine check` is not used here: hatchling emits Metadata-Version 2.5 and
      # no released twine reads it yet, so twine would reject a valid wheel.
      - name: Check distribution metadata
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import glob
          import zipfile

          from packaging.metadata import Metadata

          archive = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[0])
          name = next(n for n in archive.namelist() if n.endswith("METADATA"))
          parsed = Metadata.from_email(archive.read(name), validate=True)
          print("metadata valid:", parsed.name, parsed.version)
          PY

      # The generated code and the SDK are two PEP 420 namespace portions that
      # are merged at build time. That merge half-works silently: one portion
      # alone imports fine, so only an install proves the wheel is whole.
      - name: Install into a clean environment and prove the merge
        run: |
          uv venv --python 3.12 /tmp/verify
          uv pip install --no-cache --python /tmp/verify/bin/python dist/*.whl
          uv pip install --no-cache --python /tmp/verify/bin/python mypy types-protobuf
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import importlib.resources as resources

          import memco as mc
          from memco.memory.v1 import memory_pb2 as pb

          assert pb.DESCRIPTOR.name == "memco/memory/v1/memory.proto"
          assert mc.provenance().server_commit, "provenance descriptor missing from the wheel"
          assert (resources.files("memco") / "py.typed").is_file(), "py.typed did not ship"
          print("wheel is whole:", len(mc.__all__), "public symbols")
          PY

      # Importing one known module would not notice a future generated
      # subpackage being dropped from the wheel, so compare against the source.
      # .json covers the tool manifest, which ships in the same tree. Nothing
      # imports it — the SDK reads it at build time, not at runtime — so no
      # import check would notice its absence, and a consumer that wants the
      # definitions raw expects to find it in the installed package.
      - name: Every generated file reached the wheel
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          source = {
              str(p).replace("\\", "/")
              for p in pathlib.Path("memco/memory").rglob("*")
              if p.is_file() and p.suffix in {".py", ".pyi", ".json"}
          }
          shipped = set(zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[0]).namelist())
          missing = sorted(source - shipped)
          assert not missing, f"generated files absent from the wheel: {missing}"
          print(f"all {len(source)} generated files shipped")
          PY

      # A missing py.typed makes every annotation invisible downstream without
      # failing anything, so assert a consumer actually sees the types.
      - name: Prove the installed package is seen as typed
        run: |
          cd /tmp
          cat > consumer.py <<'PY'
          from memco import Memco
          wrong: int = Memco(token="t").provenance().server_commit
          PY
          /tmp/verify/bin/python -m mypy consumer.py 2>&1 | tee out.txt
          grep -q 'Incompatible types in assignment' out.txt \
            || { echo "installed package is not seen as typed"; exit 1; }

      # The release pipeline uploads these to PyPI as-is; rebuilding there would
      # ship an artefact that none of the above ever ran against.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: python/dist

  docs:
    name: Docs
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # -W turns warnings into errors, so a cross-reference that stops
      # resolving fails here rather than rotting in the published reference.
      # `-d` keeps the doctree cache out of the output directory, which is
      # published verbatim as the release's documentation tarball.
      - run: uv run --extra docs sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html
      # Named per language: Go and Node reuse this job's shape, and artifact
      # names are unique within a run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-python
          path: python/docs/_build/html

  runtime-compat:
    name: Runtime compat (${{ matrix.label }})
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floors the generated code asserts at import time.
          - label: oldest
            pins: "grpcio==1.76.0 protobuf==6.31.1"
          # protobuf's cross-version guarantee covers gencode on the next major.
          # This is what makes the "<8" upper bound a verified fact rather than
          # an assumption; narrow requirements.txt if it ever fails.
          - label: newest
            pins: "grpcio protobuf>=7,<8"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The generated client lives inside the package now, so importing it
      # runs memco/__init__.py and needs the package installed, not just its
      # two generated-code dependencies.
      - name: Import against ${{ matrix.label }} pins
        run: |
          uv venv --python 3.12 /tmp/compat
          uv pip install --python /tmp/compat/bin/python .
          uv pip install --python /tmp/compat/bin/python ${{ matrix.pins }}
          cd /tmp
          /tmp/compat/bin/python - <<'PY'
          import google.protobuf
          import grpc

          import memco
          from memco.memory.v1 import memory_pb2 as pb

          print("protobuf", google.protobuf.__version__, "grpcio", grpc.__version__)
          print("->", pb.DESCRIPTOR.name, "| client:", memco.Memco.__name__)
          PY

  # ---- live: merge to main, and releases ---------------------------------

  integration:
    name: Live smoke
    if: inputs.full || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # The preview endpoint is tied to a server pull request and will change.
    # Keep it a repository variable so moving it needs no code change.
    environment: integration
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # This job runs with a live API token in its environment; it has no
          # reason to also hold a push credential in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - name: Exercise the real service
        env:
          MEMCO_API_HOST: ${{ vars.MEMCO_API_HOST }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
        run: |
          uv run python - <<'PY'
          from memco import Memco, provenance
          with Memco() as client:
              print("contract:", provenance().server_commit)
              domains = client.memory.list_domains().domains
              print("domains:", [d.slug for d in domains])
              assert domains, "the service returned no domains"
              session = client.memory.start_session(domains[0].slug)
              result = client.memory.search("gRPC health checking", session_id=session.session_id)
              print("search returned", len(result.memories), "memories")
          PY
