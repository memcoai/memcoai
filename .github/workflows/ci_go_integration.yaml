name: System tests (Go)

# Called by ci_go.yaml, which decides when this runs; only the steps live
# here.
on:
  workflow_call:
    inputs:
      go-version:
        description: The Go toolchain to install. ci_go.yaml holds the pin.
        type: string
        required: true
    # Repository secrets, which the caller passes by name. None is `required`:
    # a fork's pull request has no secrets at all, and the guard step below is
    # what turns that into a skip rather than a failure.
    secrets:
      MEMCO_API_TOKEN:
        required: false
      MEMCO_CLIENT_ID:
        required: false
      MEMCO_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: System tests (go)
    # The one job that proves the SDK works against the deployed service rather
    # than against internal/testserver.
    runs-on: ubuntu-latest
    # Ingestion is asynchronous and the suite polls for it, so the worst case is
    # a few minutes PER DOMAIN and grows as domains are added. Being killed here
    # is not only a red build: cleanup runs in t.Cleanup, which a kill does not
    # reach, so a probe would be left behind in a live domain. go test's own
    # -timeout (40m, in go/Makefile's system-test) does not run cleanups either,
    # so the suite stops polling two minutes before it and fails in time to
    # clean up. Raise both before they become tight.
    timeout-minutes: 45
    # One run of THIS language at a time, across every branch — the group names
    # neither the workflow nor the ref, so two pull requests queue behind each
    # other rather than overlapping.
    #
    # The suite writes to a real domain and its insights carry no run marker, so
    # two overlapping runs of the same SDK would write identical content and be
    # folded together by deduplication; the revert would then report MERGED and
    # the test would fail. Queueing removes that class of failure rather than
    # detecting it. `cancel-in-progress: false` because a cancelled run cannot
    # reach its cleanup and would strand a probe in a live domain.
    #
    # The other languages are deliberately NOT in this group. The suites write
    # about different subjects — this one about how the Go SDK dials and
    # retries — so they cannot be read as the same knowledge and cannot
    # collide, and serialising them would only multiply the wall clock.
    #
    # Note GitHub keeps only ONE job pending per group: with several pull
    # requests in flight, an older pending run is cancelled when a newer one
    # queues behind it. Those runs never started, so they strand nothing — but
    # the check shows as cancelled and needs re-running.
    concurrency:
      group: memco-system-test-go
      cancel-in-progress: false
    defaults:
      run:
        working-directory: go
    steps:
      # First, before the checkout: a run that is going to skip should not pay
      # for a checkout and a dependency tree it will never use.
      #
      # A pull request that cannot see the secret — a fork's — skips green,
      # which is what keeps CONTRIBUTING's first promise true: "you do not need
      # access to Memco's servers to contribute". Anywhere else, a release in
      # particular, a missing credential is a misconfiguration rather than a
      # fact about the contributor, and skipping would let a publish report
      # success having never reached the service. So it fails instead.
      #
      # The check is a step because GitHub does not allow `secrets` in a
      # job-level `if:`.
      #
      # The administration and impersonation suites need the API client's
      # credentials as well as the token, so all three are held to the same
      # rule.
      - name: Check for a credential
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
          MEMCO_CLIENT_ID: ${{ secrets.MEMCO_CLIENT_ID }}
          MEMCO_CLIENT_SECRET: ${{ secrets.MEMCO_CLIENT_SECRET }}
        # Runs before the checkout, so the directory this job otherwise defaults
        # into does not exist yet.
        working-directory: .
        run: |
          if [ -n "$MEMCO_API_TOKEN" ] && [ -n "$MEMCO_CLIENT_ID" ] && [ -n "$MEMCO_CLIENT_SECRET" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::notice::the live credentials are unavailable to this pull request; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::MEMCO_API_TOKEN, GO_MEMCO_CLIENT_ID or GO_MEMCO_CLIENT_SECRET (repository secrets) did not resolve" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.guard.outputs.run == 'true'
        with:
          # This job runs with a live API token in its environment; it has no
          # reason to also hold a push credential in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        if: steps.guard.outputs.run == 'true'
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go/go.sum
      - name: Exercise the real service
        if: steps.guard.outputs.run == 'true'
        env:
          MEMCO_API_HOST: ${{ vars.MEMCO_API_HOST }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
          MEMCO_CLIENT_ID: ${{ secrets.MEMCO_CLIENT_ID }}
          MEMCO_CLIENT_SECRET: ${{ secrets.MEMCO_CLIENT_SECRET }}
        run: make system-test
      - name: Say the suite was skipped
        if: steps.guard.outputs.run != 'true'
        working-directory: .
        run: |
          echo "### System tests (go)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: \`MEMCO_API_TOKEN\`, \`MEMCO_CLIENT_ID\` and \`MEMCO_CLIENT_SECRET\` are not all available to this run." >> "$GITHUB_STEP_SUMMARY"
