name: CI (Go)

on:
  # Branches only. A tag push belongs to the release pipeline, which calls this
  # workflow itself; an unfiltered `push` would run every check twice.
  push:
    branches: ["**"]
  pull_request:
  # The release pipeline calls this so a tag re-runs every check from one
  # definition. Duplicating the jobs there would guarantee they drift.
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever the ref.
        type: boolean
        default: false

# Public repository: grant nothing by default, and let a fork PR run every
# hermetic job without needing a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This file decides *when* each check runs; the steps of each one live in the
# ci_go_*.yaml workflow it calls. The Go pin is repeated in every call because
# a called workflow cannot see this file's `env`, and a `with:` value cannot
# read it either. Keep the copies identical, and equal to GO_VERSION in
# release_go.yaml.
#
# The pin is 1.26, not go.mod's 1.25 floor: golangci-lint v2.13.2 declares
# go 1.26.0, and setup-go exports GOTOOLCHAIN=local, so an older toolchain
# cannot build it. The floor itself is covered by the matrix.
jobs:
  # ---- cheap, runs on every push -----------------------------------------

  # Language-agnostic, so it is defined once and called by every language's CI
  # rather than owned by this one. See the comment at the top of that file.
  provenance:
    uses: ./.github/workflows/provenance.yaml

  lint:
    uses: ./.github/workflows/ci_go_lint.yaml
    with:
      go-version: "1.26"

  typecheck:
    uses: ./.github/workflows/ci_go_typecheck.yaml
    with:
      go-version: "1.26"

  test:
    uses: ./.github/workflows/ci_go_test.yaml
    with:
      go-version: "1.26"

  # ---- longer: pull requests, main, and releases -------------------------

  test-matrix:
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci_go_test_matrix.yaml

  # There is deliberately no `runtime-compat` job here. Minimal version
  # selection never resolves a dependency below the floor go.mod requires, so
  # there is no older dependency set to sweep, and the 1.25/1.27 matrix above
  # already covers the toolchain axis.

  build:
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci_go_build.yaml
    with:
      go-version: "1.26"

  docs:
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci_go_docs.yaml
    with:
      go-version: "1.26"

  # ---- live: every pull request, main, and releases -----------------------

  integration:
    # Runs on pull requests too, because a contract change that only breaks
    # over the wire would otherwise land green and surface in a user's hands;
    # `inputs.full` keeps it ahead of a release, so a publish cannot ship a
    # build nothing verified live.
    if: >-
      inputs.full
      || github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ci_go_integration.yaml
    with:
      go-version: "1.26"
    # Named rather than `inherit`: this is the one check that needs
    # credentials, and these are the ones it needs. A fork's pull request has
    # none, so the values may be empty; the called workflow decides whether that
    # is a skip or a failure.
    secrets:
      MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
      MEMCO_CLIENT_ID: ${{ secrets.GO_MEMCO_CLIENT_ID }}
      MEMCO_CLIENT_SECRET: ${{ secrets.GO_MEMCO_CLIENT_SECRET }}
