name: Test matrix (Go)

# Called by ci_go.yaml, which decides when this runs; only the steps live
# here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is go.mod's floor; 1.26 is covered by ci_go_test.yaml, pinned in
        # ci_go.yaml. Quoted, so YAML cannot read 1.30 as 1.3.
        go: ["1.25", "1.27"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go/go.sum
            go/examples/go.sum
      - run: make test
