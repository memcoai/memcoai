name: Release (Python)

# Publishing a release is the trigger, not a bare tag push: a human writes or
# generates the notes and hits Publish through the normal GitHub UI, and only
# then does this pipeline build and attach the real artefacts. That ordering
# is deliberate — the previous design had CI draft the release with the
# artefacts already attached, for a human to edit before publishing, and
# editing a draft's notes through the GitHub UI turned out to silently drop
# already-attached assets. Publish-then-attach has no window where that can
# happen: nothing is attached until after the human is done.
#
# `on: release` carries no tag-prefix filter the way `push: tags: [...]` did,
# so this fires for a `nodejs-v*` release too — `gate`'s `if:` below is what
# skips it immediately when the prefix isn't this pipeline's.
on:
  release:
    types: [published]

permissions:
  contents: read

# A release must never be cancelled part-way: a PyPI version cannot be
# re-uploaded, so a half-finished run is not something to replace with a newer one.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # Must match ci_python.yaml. The artefacts are built there and published
  # here, so a drift between the two is silent.
  UV_VERSION: "0.9.7"
  # Cold caches and large downloads occasionally outrun uv's 30s default read
  # timeout on a shared runner; this only widens the window.
  UV_HTTP_TIMEOUT: "60"

jobs:
  gate:
    name: Gate
    if: startsWith(github.event.release.tag_name, 'python-v')
    runs-on: ubuntu-latest
    # The release that triggered this run already exists and is already
    # public by the time gate runs — publishing is the trigger. A bad tag can
    # no longer be caught before anything public happens, so this job cleans
    # up after itself on failure instead: delete the release and its tag
    # rather than leave a live release with no build artefacts behind for
    # someone to trip over.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          # The ancestry check below needs the history joining the tag to main,
          # which the default shallow fetch does not have.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The tag is the only thing a human types, and everything downstream is
      # named from it. Parsing with `packaging` means a version PyPI would
      # reject is refused before the pipeline spends anything on it.
      - name: The tag names a valid version, and the one the package declares
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.12 --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"]
          raw = tag.removeprefix("python-v")
          try:
              tagged = Version(raw)
          except InvalidVersion:
              subprocess.run(["gh", "release", "delete", tag, "--yes", "--cleanup-tag"], check=True)
              sys.exit(f"tag {tag} does not name a PEP 440 version: {raw!r}; release and tag removed")

          pyproject = tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())
          declared = Version(pyproject["project"]["version"])
          if tagged != declared:
              subprocess.run(["gh", "release", "delete", tag, "--yes", "--cleanup-tag"], check=True)
              sys.exit(
                  f"tag {tag} claims version {raw}, but python/pyproject.toml "
                  f"declares {declared}; release and tag removed"
              )

          # Name everything from the *declared* version, not the tag text: it
          # is what hatchling writes into the wheel filename, and PEP 440 makes
          # `0.1.0.0` and `0.1.0` the same version, so the tag may spell it
          # differently without the assets disagreeing.
          print(f"version={declared}")
          # True for pre-releases and dev releases alike, which is exactly the
          # set that should not be presented as a finished release.
          print(f"prerelease={str(declared.is_prerelease).lower()}")
          PY

      # "On main, on tag": a release published from a side branch ships code
      # that never passed review, and nothing else in this pipeline would notice.
      - name: The tagged commit is contained in main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Fetched explicitly so FETCH_HEAD is well defined regardless of
          # which refs the checkout happened to bring down.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            gh release delete "$TAG" --yes --cleanup-tag
            echo "::error::$TAG is not an ancestor of main; release from main only. Release and tag removed."
            exit 1
          }

  # Everything CI runs, with the jobs that are normally reserved for pull
  # requests and main forced on. One definition, so a release cannot verify less
  # than a pull request does.
  ci:
    name: Checks
    needs: gate
    uses: ./.github/workflows/ci_python.yaml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: [gate, ci]
    runs-on: ubuntu-latest
    # Trusted publishing exchanges this job's OIDC identity for a short-lived
    # PyPI token, so there is no long-lived secret to hold, leak or rotate.
    # PyPI issues it only to the publisher configured on the project: this
    # repository, this workflow file, this environment — see
    # https://docs.github.com/en/actions/concepts/security/openid-connect.
    permissions:
      id-token: write
    # No secret lives here now, but the environment stays: give it a required
    # reviewer and publishing a release becomes verify-everything, then wait
    # for a human before the irreversible upload.
    environment:
      name: pypi
      url: https://pypi.org/project/memcoai/${{ needs.gate.outputs.version }}
    steps:
      # Exactly the artefacts the build job verified.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist-python
          path: dist
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}

      # `always` rather than `automatic`: a trusted publisher that is missing
      # or misconfigured on PyPI's side must fail loudly here, not fall back
      # to an anonymous upload that fails with an opaque 403 reading like a
      # PyPI outage rather than the setup mistake it is.
      - name: Publish
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  attach:
    name: Attach release artefacts
    needs: [gate, publish]
    runs-on: ubuntu-latest
    # The only job here that writes anything back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist-python
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docs-python
          path: docs

      # The <language>/<version>/ prefix is deliberate: it lets the docs site
      # extract the tarball in place without renaming anything, and Node reuses
      # the shape. Every link inside the built reference is relative, so it
      # works from whatever path the site mounts it at.
      - name: Package the reference
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p "stage/python/$VERSION"
          cp -r docs/. "stage/python/$VERSION/"
          tar czf "memco-docs-python-$VERSION.tar.gz" -C stage python

      # The release already exists and is already published — that is what
      # triggered this run — so this only adds to it. `--clobber` makes a
      # re-run (say, after a transient failure here) overwrite rather than
      # error on assets a previous attempt already uploaded.
      - name: Attach the build artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          gh release upload "$TAG" \
            --clobber \
            dist/*.whl dist/*.tar.gz "memco-docs-python-$VERSION.tar.gz"
