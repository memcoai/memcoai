name: Test matrix (Node.js)

# Called by ci_nodejs.yaml, which decides when this runs; only the steps live
# here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]  # 24 is covered by ci_nodejs_test.yaml, pinned from .nvmrc
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - run: npm ci
      - run: npm test
