name: CI (Python)

on:
  # Branches only. A tag push belongs to the release pipeline, which calls this
  # workflow itself; an unfiltered `push` would run every check twice.
  push:
    branches: ["**"]
  pull_request:
  # The release pipeline calls this so a tag re-runs every check from one
  # definition. Duplicating the jobs there would guarantee they drift.
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever the ref.
        type: boolean
        default: false

# Public repository: grant nothing by default, and let a fork PR run every
# hermetic job without needing a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  # ---- cheap, runs on every push -----------------------------------------

  # Language-agnostic, so it is defined once and called by every language's CI
  # rather than owned by this one. See the comment at the top of that file.
  provenance:
    uses: ./.github/workflows/provenance.yaml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy

  test:
    name: Test (3.12)
    # Pinned explicitly: without --python, uv resolves the interpreter from
    # python/.python-version (the supported floor), so this job would silently
    # duplicate the matrix's 3.10 run and leave 3.12 untested.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev --python 3.12
      # Coverage runs on this job only: the matrix jobs prove the suite passes on
      # every supported interpreter, and measuring the same lines four times
      # would say nothing new. `fail_under` in pyproject.toml is the gate — this
      # step fails the build below the floor, so the badge cannot go stale.
      - run: uv run --python 3.12 pytest -q --cov --cov-report=term --cov-report=xml
      - name: Report coverage
        if: always()
        run: |
          uv run --python 3.12 python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          report = pathlib.Path("coverage.xml")
          if not report.exists():
              print("### Coverage\n\nNo report produced — the suite did not finish.")
              raise SystemExit
          root = ET.parse(report).getroot()
          rate = float(root.get("line-rate", 0)) * 100
          branch = float(root.get("branch-rate", 0)) * 100
          print(f"### Coverage\n\n**{rate:.1f}%** of lines, **{branch:.1f}%** of branches.\n")
          print("| Module | Lines |\n|---|---|")
          for cls in sorted(root.iter("class"), key=lambda c: float(c.get("line-rate", 0))):
              print(f"| `{cls.get('filename')}` | {float(cls.get('line-rate', 0)) * 100:.0f}% |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-python
          path: python/coverage.xml
          retention-days: 14

  # ---- longer: pull requests, main, and releases -------------------------

  test-matrix:
    name: Test (${{ matrix.python }})
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]  # 3.12 is covered by the `test` job
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q

  build:
    name: Build and install
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Not `--wheel`: plain `uv build` writes the sdist first and then builds
      # the wheel *from that sdist*, so every check below runs against a wheel
      # that came through the source distribution. That is what proves the sdist
      # is whole: a requirements input or a generated module missing from it
      # fails here rather than in a consumer's install from source.
      - name: Build the sdist, and the wheel from it
        run: uv build

      # Validated with `packaging`, the same parser PyPI's own index uses.
      # `twine check` is not used here: hatchling emits Metadata-Version 2.5 and
      # no released twine reads it yet, so twine would reject a valid wheel.
      - name: Check distribution metadata
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import glob
          import zipfile

          from packaging.metadata import Metadata

          archive = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[0])
          name = next(n for n in archive.namelist() if n.endswith("METADATA"))
          parsed = Metadata.from_email(archive.read(name), validate=True)
          print("metadata valid:", parsed.name, parsed.version)
          PY

      # The generated code and the SDK are two PEP 420 namespace portions that
      # are merged at build time. That merge half-works silently: one portion
      # alone imports fine, so only an install proves the wheel is whole.
      - name: Install into a clean environment and prove the merge
        run: |
          uv venv --python 3.12 /tmp/verify
          uv pip install --no-cache --python /tmp/verify/bin/python dist/*.whl
          uv pip install --no-cache --python /tmp/verify/bin/python mypy types-protobuf
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import importlib.resources as resources

          import memco as mc
          from memco.memory.v1 import memory_pb2 as pb

          assert pb.DESCRIPTOR.name == "memco/memory/v1/memory.proto"
          assert mc.provenance().server_commit, "provenance descriptor missing from the wheel"
          assert (resources.files("memco") / "py.typed").is_file(), "py.typed did not ship"
          print("wheel is whole:", len(mc.__all__), "public symbols")
          PY

      # Importing one known module would not notice a future generated
      # subpackage being dropped from the wheel, so compare against the source.
      # .json covers the tool manifest, which ships in the same tree. Nothing
      # imports it — the SDK reads it at build time, not at runtime — so no
      # import check would notice its absence, and a consumer that wants the
      # definitions raw expects to find it in the installed package.
      - name: Every generated file reached the wheel
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          source = {
              str(p).replace("\\", "/")
              for p in pathlib.Path("memco/memory").rglob("*")
              if p.is_file() and p.suffix in {".py", ".pyi", ".json"}
          }
          shipped = set(zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[0]).namelist())
          missing = sorted(source - shipped)
          assert not missing, f"generated files absent from the wheel: {missing}"
          print(f"all {len(source)} generated files shipped")
          PY

      # A missing py.typed makes every annotation invisible downstream without
      # failing anything, so assert a consumer actually sees the types.
      - name: Prove the installed package is seen as typed
        run: |
          cd /tmp
          cat > consumer.py <<'PY'
          from memco import Memco
          wrong: int = Memco(token="t").provenance().server_commit
          PY
          /tmp/verify/bin/python -m mypy consumer.py 2>&1 | tee out.txt
          grep -q 'Incompatible types in assignment' out.txt \
            || { echo "installed package is not seen as typed"; exit 1; }

      # The release pipeline uploads these to PyPI as-is; rebuilding there would
      # ship an artefact that none of the above ever ran against.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-python
          path: python/dist

  docs:
    name: Docs
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # -W turns warnings into errors, so a cross-reference that stops
      # resolving fails here rather than rotting in the published reference.
      # `-d` keeps the doctree cache out of the output directory, which is
      # published verbatim as the release's documentation tarball.
      - run: uv run --extra docs sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html
      # The same sources rendered a second time as markdown, for the assembler
      # below. sphinx-markdown-builder renders no admonition holding a doctest
      # block, so with conf.py's `Example:` handling left as it is every worked
      # example is dropped with a warning; rendering them as a plain section
      # keeps them. Its own doctree cache, because that override is a config
      # change and a config change invalidates the whole cache.
      - run: >-
          uv run --extra docs sphinx-build -b markdown -W --keep-going
          -D napoleon_use_admonition_for_examples=0
          -D napoleon_use_admonition_for_notes=0
          -d docs/_build/doctrees-markdown docs docs/_build/markdown
      # Writes llms.txt and llms-full.txt into the HTML output, so the artifact
      # below carries them and the release tarball publishes them beside the
      # reference. Fails if a page the build published is not reachable from
      # llms.txt, so a new page has to be indexed before it can ship.
      - run: uv run --extra docs python ../scripts/build_llms_txt.py python
      # Named per language: Go and Node reuse this job's shape, and artifact
      # names are unique within a run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-python
          path: python/docs/_build/html

  runtime-compat:
    name: Runtime compat (${{ matrix.label }})
    if: inputs.full || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # memory_pb2.py opens with ValidateProtobufRuntimeVersion(..., 6, 31,
          # 1, ...), so requirements.txt's floors are load-bearing: too old a
          # protobuf fails at import. Every direct dependency is resolved down,
          # not only those two, and a floor the rest of the graph cannot admit
          # is backtracked past — googleapis-common-protos lands on 1.69.2, not
          # the 1.60.0 deps/sdk.txt declares, because releases before it cap
          # protobuf below our own floor.
          - label: oldest
            resolution: lowest-direct
            protobuf_major: "6"
          # The newest protobuf the requirements admit, a major ahead of the
          # gencode. That is what makes the "<8" upper bound a verified fact
          # rather than an assumption: protobuf's cross-version guarantee
          # covers gencode on the next major, and this exercises it. Narrow
          # requirements.txt if it ever fails.
          - label: newest
            resolution: highest
            protobuf_major: "7"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The generated client lives inside the package now, so importing it
      # runs memco/__init__.py and needs the package installed, not just its
      # two generated-code dependencies.
      #
      # One resolution, so the versions under test are ones a resolver would
      # actually produce. Installing pins afterwards is a second, independent
      # resolution that does not revisit what the first one left in place, and
      # so can assemble a combination no user could be given. Whatever the
      # matrix carries lands in this shell verbatim: keep it to literals with
      # no metacharacters, or quote it.
      - name: Import against ${{ matrix.label }} dependencies
        run: |
          uv venv --python 3.12 /tmp/compat
          uv pip install --python /tmp/compat/bin/python --resolution ${{ matrix.resolution }} .
          cd /tmp
          /tmp/compat/bin/python - <<'PY'
          import google.protobuf
          import grpc

          import memco
          from memco.memory.v1 import memory_pb2 as pb

          print("protobuf", google.protobuf.__version__, "grpcio", grpc.__version__)
          print("->", pb.DESCRIPTOR.name, "| client:", memco.Memco.__name__)

          # The import above cannot tell the two ends apart on its own: a cap
          # anywhere in the graph could quietly resolve both legs to the same
          # protobuf and this job would report success having proved nothing.
          major = google.protobuf.__version__.split(".")[0]
          if major != "${{ matrix.protobuf_major }}":
              raise SystemExit(f"expected protobuf ${{ matrix.protobuf_major }}.x, got {major}.x")
          PY

  # ---- live: every pull request, main, and releases -----------------------

  integration:
    name: System tests (python)
    # The one job that proves the SDK works against the deployed service rather
    # than against tests/fake_server.py. It runs on pull requests too, because
    # a contract change that only breaks over the wire would otherwise land
    # green and surface in a user's hands; `inputs.full` keeps it ahead of a release, so a
    # publish cannot ship a build nothing verified live.
    if: >-
      inputs.full
      || github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Ingestion is asynchronous and the suite polls for it, so the worst case is
    # a few minutes PER DOMAIN and grows as domains are added. Being killed here
    # is not only a red build: cleanup runs in a `finally`, which a kill does not
    # reach, so a probe would be left behind in a live domain. Raise this before
    # it becomes tight.
    timeout-minutes: 45
    # One run of THIS language at a time, across every branch — the group names
    # neither the workflow nor the ref, so two pull requests queue behind each
    # other rather than overlapping.
    #
    # The suite writes to a real domain and its insights carry no run marker, so
    # two overlapping runs of the same SDK would write identical content and be
    # folded together by deduplication; the revert would then report MERGED and
    # the test would fail. Queueing removes that class of failure rather than
    # detecting it. `cancel-in-progress: false` because a cancelled run cannot
    # reach the cleanup in its `finally` and would strand a probe in a live
    # domain.
    #
    # The other language is deliberately NOT in this group. The two suites write
    # about different subjects — this one about the Python retry policy — so they cannot be read
    # as the same knowledge and cannot collide, and serialising them would only
    # double the wall clock.
    #
    # Note GitHub keeps only ONE job pending per group: with several pull
    # requests in flight, an older pending run is cancelled when a newer one
    # queues behind it. Those runs never started, so they strand nothing — but
    # the check shows as cancelled and needs re-running.
    concurrency:
      group: memco-system-test-python
      cancel-in-progress: false
    # No `environment:`. MEMCO_API_TOKEN is a repository secret, so an
    # environment is not what makes it reachable, and declaring one would
    # subject this job to that environment's protection rules: required
    # reviewers would park every pull request awaiting approval, and a
    # deployment-branch policy would fail them outright, since a pull request's
    # ref is refs/pull/N/merge and matches no branch policy.
    defaults:
      run:
        working-directory: python
    steps:
      # First, before the checkout: a run that is going to skip should not pay
      # for a checkout and a dependency tree it will never use.
      #
      # A pull request that cannot see the secret — a fork's — skips green,
      # which is what keeps CONTRIBUTING's first promise true: "you do not need
      # access to Memco's servers to contribute". Anywhere else, a release in
      # particular, a missing credential is a misconfiguration rather than a
      # fact about the contributor, and skipping would let a publish report
      # success having never reached the service. So it fails instead.
      #
      # The check is a step because GitHub does not allow `secrets` in a
      # job-level `if:`.
      - name: Check for a credential
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
        # Runs before the checkout, so the directory this job otherwise defaults
        # into does not exist yet.
        working-directory: .
        run: |
          if [ -n "$MEMCO_API_TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::notice::MEMCO_API_TOKEN is unavailable to this pull request; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::MEMCO_API_TOKEN did not resolve; it is a repository secret" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.guard.outputs.run == 'true'
        with:
          # This job runs with a live API token in its environment; it has no
          # reason to also hold a push credential in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        if: steps.guard.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: steps.guard.outputs.run == 'true'
        run: uv sync --extra dev
      - name: Exercise the real service
        if: steps.guard.outputs.run == 'true'
        env:
          MEMCO_API_HOST: ${{ vars.MEMCO_API_HOST }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
        run: uv run pytest -q systemtest
      - name: Say the suite was skipped
        if: steps.guard.outputs.run != 'true'
        working-directory: .
        run: |
          echo "### System tests (python)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: no \`MEMCO_API_TOKEN\` is available to this run." >> "$GITHUB_STEP_SUMMARY"
