name: Release (Go)

# The tag prefix scopes a release to one SDK, so each SDK in this repository
# versions independently: `go-v*` here, as `python-v*` and `nodejs-v*` are for
# the other two.
#
# The go command itself knows nothing of `go-v*`: it resolves a module in go/
# only from a tag named go/vX.Y.Z, slash and all. That second tag is the
# publication. Nothing here uploads anything; the first request for the version
# makes the module proxy fetch it from this repository, and the proxy and the
# checksum database then keep that copy for good. So a person pushes
# go-vX.Y.Z, and the publish job below creates go/vX.Y.Z on the same commit
# only once every check has passed. Never push a go/v* tag by hand: it would
# publish a version nothing verified.
#
# A tag moved afterwards changes nothing anyone downloads, and only makes the
# repository disagree with them. Withdraw a bad release with a `retract`
# directive in a later one, never by moving or deleting its tags.
on:
  push:
    tags: ["go-v*"]

permissions:
  contents: read

# A release must never be cancelled part-way: once the module tag exists, the
# version is public.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the pin ci_go.yaml passes to every job it calls.
  GO_VERSION: "1.26"
  MODULE: github.com/memcoai/memcoai/go

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The ancestry check below needs the history joining the tag to main,
          # which the default shallow fetch does not have.
          fetch-depth: 0
          # `persist-credentials` is deliberately left at its default here: the
          # ancestry check below runs `git fetch origin main`, and the
          # credential the checkout leaves in .git/config is what authenticates
          # that fetch while the repository is not yet public. This job holds no
          # secret of its own, so there is nothing for that credential to sit
          # beside.

      # This job installs nothing. Every hosted runner already ships Python, and
      # the whole gate is a regex and two string comparisons.
      - name: The tag names a valid version, and the one the module declares
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys

          # The expression published at semver.org. Capture groups: major,
          # minor, patch, prerelease, build metadata.
          SEMVER = re.compile(
              r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?"
          )

          def refuse(message):
              print(message, file=sys.stderr)
              sys.exit(1)

          tag = os.environ["TAG"]
          if not tag.startswith("go-v"):
              refuse(f"tag {tag} is not of the form go-vX.Y.Z")
          raw = tag.removeprefix("go-v")
          match = SEMVER.fullmatch(raw)
          if match is None:
              refuse(f"tag {tag} does not name a semantic version: {raw!r}")
          # The go command treats build metadata as not part of the version,
          # so a tag carrying it can never be fetched by the name it was given.
          if match.group(5) is not None:
              refuse(f"tag {tag} carries build metadata, which Go module versions cannot")

          declared = re.search(
              r'^const Version = "([^"\n]+)"$',
              open("go/memcoai/version.go", encoding="utf-8").read(),
              re.M,
          )
          if declared is None:
              refuse("go/memcoai/version.go declares no const Version")
          # Compared as strings: semver admits one spelling per version.
          if raw != declared.group(1):
              refuse(f"tag {tag} claims version {raw}, but go/memcoai/version.go declares {declared.group(1)}")

          # From v2 on, a module's path must end in its major version, or the
          # go command refuses the tag.
          module = re.search(r"^module\s+(\S+)", open("go/go.mod", encoding="utf-8").read(), re.M)
          major = int(match.group(1))
          if major >= 2 and (module is None or not module.group(1).endswith(f"/v{major}")):
              refuse(f"version {raw} needs the module path to end in /v{major}, not {module and module.group(1)}")

          print(f"version={raw}")
          # A prerelease identifier is present: 0.1.0-rc.1, but not 0.1.0.
          print(f"prerelease={'true' if match.group(4) is not None else 'false'}")
          PY

      # "On main, on tag": a tag pushed from a side branch releases code that
      # never passed review, and nothing else in this pipeline would notice.
      - name: The tagged commit is contained in main
        run: |
          # Fetched explicitly so FETCH_HEAD is well defined regardless of
          # which refs the checkout happened to bring down.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main; release from main only"
            exit 1
          }

  # Everything CI runs, with the jobs that are normally reserved for pull
  # requests and main forced on. One definition, so a release cannot verify less
  # than a pull request does.
  ci:
    name: Checks
    needs: gate
    uses: ./.github/workflows/ci_go.yaml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish through the module proxy
    needs: [gate, ci]
    runs-on: ubuntu-latest
    # Creating the module tag is this job's one write, and the irreversible
    # step of the release.
    permissions:
      contents: write
    # No secret lives here, but the environment stays: give it a required
    # reviewer and the module tag waits for a human who has seen the checks
    # pass.
    environment:
      name: go
      url: https://pkg.go.dev/github.com/memcoai/memcoai/go/memcoai@v${{ needs.gate.outputs.version }}
    steps:
      # On GITHUB_SHA, the commit the gate and the checks ran against. Through
      # the API, so the job needs no checkout. A re-run finds the tag already
      # there, which is fine only if it names the same commit.
      - name: Tag the module
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ref="tags/go/v$VERSION"
          if existing=$(gh api "repos/$GH_REPO/git/ref/$ref" --jq .object.sha 2>/dev/null); then
            [ "$existing" = "$GITHUB_SHA" ] || {
              echo "::error::go/v$VERSION already names $existing, not $GITHUB_SHA"
              exit 1
            }
            echo "go/v$VERSION already names $GITHUB_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/$ref" -f sha="$GITHUB_SHA" > /dev/null
            echo "created go/v$VERSION at $GITHUB_SHA"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # Nothing is checked out, so there is no go.sum to key a cache on.
          cache: false

      # The request that makes the proxy fetch the tag. It can lag a fresh tag
      # by a little, so a miss is retried before it is called a failure.
      - name: Ask the proxy for the version
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          GOPROXY: https://proxy.golang.org
        run: |
          for attempt in 1 2 3 4 5; do
            if go list -m -json "$MODULE@v$VERSION"; then
              exit 0
            fi
            echo "attempt $attempt: the proxy does not serve $MODULE@v$VERSION yet"
            [ "$attempt" -eq 5 ] || sleep 30
          done
          echo "::error::proxy.golang.org never served $MODULE@v$VERSION"
          exit 1

      # What a user runs, through the default proxy and checksum database.
      - name: A fresh module installs it
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir consumer && cd consumer
          go mod init consumer > /dev/null
          cat > main.go <<'GO'
          package main

          import (
          	"fmt"

          	"github.com/memcoai/memcoai/go/memcoai"
          )

          func main() { fmt.Println(memcoai.Version) }
          GO
          go get "$MODULE/memcoai@v$VERSION"
          out=$(go run .)
          [ "$out" = "$VERSION" ] || { echo "::error::installed $out, not $VERSION"; exit 1; }

  release:
    name: Draft the GitHub release
    needs: [gate, publish]
    runs-on: ubuntu-latest
    # The only job here that writes anything back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docs-go
          path: docs

      # The <language>/<version>/ prefix is the same shape the other pipelines
      # stage: it lets the docs site extract the tarball in place without
      # renaming anything, and every link inside the built reference is
      # relative, so it works from whatever path the site mounts it at.
      - name: Package the reference
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p "stage/go/$VERSION"
          cp -r docs/. "stage/go/$VERSION/"
          tar czf "memco-docs-go-$VERSION.tar.gz" -C stage go

      # A draft, not a release: the generated notes are a starting point, and
      # nobody should read them until someone has edited them. There is no
      # module asset to attach; the proxy is where the module lives.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          # --verify-tag: time passes between the tag push and this step, and
          # without it a tag deleted meanwhile makes `gh` silently create a new
          # one at the default branch head. `gh` has no --prerelease detection
          # of its own, so an rc would otherwise draft as a finished release.
          if [ "$PRERELEASE" = "true" ]; then set -- --prerelease; else set --; fi
          url=$(gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Go SDK $VERSION" \
            "$@" \
            "memco-docs-go-$VERSION.tar.gz")
          echo "::notice::draft release ready to edit and publish: $url"
