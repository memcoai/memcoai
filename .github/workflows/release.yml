name: Release (Python)

# The tag prefix scopes a release to one SDK: `go/` and `nodejs/` take `go-v*`
# and `nodejs-v*` once they have build tooling of their own.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

# A release must never be cancelled part-way: a PyPI version cannot be
# re-uploaded, so a half-finished run is not something to replace with a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match ci.yml. The artefacts are built there and published here, so a
  # drift between the two is silent.
  UV_VERSION: "0.9.7"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The ancestry check below needs the history joining the tag to main,
          # which the default shallow fetch does not have.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}

      # The tag is the only thing a human types, and everything downstream is
      # named from it. Parsing with `packaging` means a version PyPI would
      # reject is refused before the pipeline spends anything on it.
      - name: The tag names a valid version, and the one the package declares
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.12 --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"]
          raw = tag.removeprefix("python-v")
          try:
              tagged = Version(raw)
          except InvalidVersion:
              sys.exit(f"tag {tag} does not name a PEP 440 version: {raw!r}")

          pyproject = tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())
          declared = Version(pyproject["project"]["version"])
          if tagged != declared:
              sys.exit(
                  f"tag {tag} claims version {raw}, but python/pyproject.toml "
                  f"declares {declared}"
              )

          # Name everything from the *declared* version, not the tag text: it
          # is what hatchling writes into the wheel filename, and PEP 440 makes
          # `0.1.0.0` and `0.1.0` the same version, so the tag may spell it
          # differently without the assets disagreeing.
          print(f"version={declared}")
          # True for pre-releases and dev releases alike, which is exactly the
          # set that should not be presented as a finished release.
          print(f"prerelease={str(declared.is_prerelease).lower()}")
          PY

      # "On main, on tag": a tag pushed from a side branch releases code that
      # never passed review, and nothing else in this pipeline would notice.
      - name: The tagged commit is contained in main
        run: |
          # Fetched explicitly so FETCH_HEAD is well defined regardless of
          # which refs the checkout happened to bring down.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main; release from main only"
            exit 1
          }

  # Everything CI runs, with the jobs that are normally reserved for pull
  # requests and main forced on. One definition, so a release cannot verify less
  # than a pull request does.
  ci:
    name: Checks
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    # The nested live smoke test reads MEMCO_API_TOKEN from its own environment.
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: [gate, ci]
    runs-on: ubuntu-latest
    # PYPI_API_TOKEN lives in this environment. Give it a required reviewer and
    # a tag push becomes verify-everything, then wait for a human.
    environment:
      name: pypi
      url: https://pypi.org/project/memco/${{ needs.gate.outputs.version }}
    steps:
      # Exactly the artefacts the build job verified.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: ${{ env.UV_VERSION }}

      # The guard is not ceremony: uv uploads anonymously on an empty token, so
      # a secret that was never filled in would otherwise surface as an opaque
      # 403 from PyPI rather than as the setup mistake it is.
      #
      # To move to trusted publishing later: drop UV_PUBLISH_TOKEN and add
      # `--trusted-publishing always` plus `id-token: write` to this job.
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "$UV_PUBLISH_TOKEN" ] || {
            echo "::error::PYPI_API_TOKEN is not set in the 'pypi' environment"
            exit 1
          }
          uv publish dist/*.whl dist/*.tar.gz

  release:
    name: Draft the GitHub release
    needs: [gate, publish]
    runs-on: ubuntu-latest
    # The only job here that writes anything back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docs
          path: docs

      # The <language>/<version>/ prefix is deliberate: it lets the docs site
      # extract the tarball in place without renaming anything, and Go and Node
      # reuse the shape. See "The documentation tarball" in CONTRIBUTING.md.
      - name: Package the reference
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p "stage/python/$VERSION"
          cp -r docs/. "stage/python/$VERSION/"
          tar czf "memco-docs-python-$VERSION.tar.gz" -C stage python

      # A draft, not a release: the generated notes are a starting point, and
      # nobody should read them until someone has edited them. The irreversible
      # step already happened one job ago, on PyPI.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          # --verify-tag: hours pass between the tag push and this step, and
          # without it a tag deleted meanwhile makes `gh` silently create a new
          # one at the default branch head. `gh` has no --prerelease detection
          # of its own, so an rc would otherwise draft as a finished release.
          if [ "$PRERELEASE" = "true" ]; then set -- --prerelease; else set --; fi
          url=$(gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Python SDK $VERSION" \
            "$@" \
            dist/*.whl dist/*.tar.gz "memco-docs-python-$VERSION.tar.gz")
          echo "::notice::draft release ready to edit and publish: $url"
