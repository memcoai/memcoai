name: Release (Node.js)

# Publishing a release is the trigger, not a bare tag push: a human writes or
# generates the notes and hits Publish through the normal GitHub UI, and only
# then does this pipeline build and attach the real artefacts. That ordering
# is deliberate — the previous design had CI draft the release with the
# artefacts already attached, for a human to edit before publishing, and
# editing a draft's notes through the GitHub UI turned out to silently drop
# already-attached assets. Publish-then-attach has no window where that can
# happen: nothing is attached until after the human is done.
#
# `on: release` carries no tag-prefix filter the way `push: tags: [...]` did,
# so this fires for a `python-v*` release too — `gate`'s `if:` below is what
# skips it immediately when the prefix isn't this pipeline's.
on:
  release:
    types: [published]

permissions:
  contents: read

# A release must never be cancelled part-way: an npm version cannot be
# re-published, so a half-finished run is not something to replace with a newer one.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: startsWith(github.event.release.tag_name, 'nodejs-v')
    runs-on: ubuntu-latest
    # The release that triggered this run already exists and is already
    # public by the time gate runs — publishing is the trigger. A bad tag can
    # no longer be caught before anything public happens, so this job cleans
    # up after itself on failure instead: delete the release and its tag
    # rather than leave a live release with no build artefacts behind for
    # someone to trip over.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          # The ancestry check below needs the history joining the tag to main,
          # which the default shallow fetch does not have.
          fetch-depth: 0

      # This job installs nothing. Every hosted runner already ships Node, and
      # the whole gate is a regex and a string comparison — pulling a toolchain
      # in to run them would be the slowest part of the fastest job.
      - name: The tag names a valid version, and the one the package declares
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          // The expression published at semver.org, inlined verbatim. Capture
          // groups: major, minor, patch, prerelease, build metadata.
          const SEMVER =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/

          function fail(message) {
            execFileSync('gh', ['release', 'delete', tag, '--yes', '--cleanup-tag'])
            console.error(`${message}; release and tag removed`)
            process.exit(1)
          }

          // The tag is the only thing a human types here, and everything
          // downstream is named from it. Refusing a version npm would reject
          // costs nothing now and saves a half-run release later.
          const tag = process.env.TAG
          const raw = tag.replace(/^nodejs-v/, '')
          const match = SEMVER.exec(raw)
          if (match === null) {
            fail(`tag ${tag} does not name a semantic version: ${JSON.stringify(raw)}`)
          }

          const declared = JSON.parse(readFileSync('nodejs/package.json', 'utf8')).version
          // Compared as strings, and that is enough: semver admits exactly one
          // spelling per version, so there is no pair of different-looking tags
          // that name the same release. PEP 440 does — `0.1.0.0` and `0.1.0` —
          // which is why the Python gate has to compare parsed version objects
          // and then name the assets from the declared spelling rather than the
          // tag's. Here the two cannot disagree.
          if (raw !== declared) {
            fail(`tag ${tag} claims version ${raw}, but nodejs/package.json declares ${declared}`)
          }

          console.log(`version=${declared}`)
          // A prerelease identifier is present: 0.1.0-rc.1, but not 0.1.0.
          // Exactly the set that should not be presented as a finished release.
          console.log(`prerelease=${match[4] !== undefined}`)
          JS

      # "On main, on tag": a release published from a side branch ships code
      # that never passed review, and nothing else in this pipeline would notice.
      - name: The tagged commit is contained in main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Fetched explicitly so FETCH_HEAD is well defined regardless of
          # which refs the checkout happened to bring down.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            gh release delete "$TAG" --yes --cleanup-tag
            echo "::error::$TAG is not an ancestor of main; release from main only. Release and tag removed."
            exit 1
          }

  # Everything CI runs, with the jobs that are normally reserved for pull
  # requests and main forced on. One definition, so a release cannot verify less
  # than a pull request does.
  ci:
    name: Checks
    needs: gate
    uses: ./.github/workflows/ci_nodejs.yaml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish to npm
    needs: [gate, ci]
    runs-on: ubuntu-latest
    # Trusted publishing exchanges this job's OIDC identity for a short-lived
    # npm token, so there is no long-lived secret to hold, leak or rotate. npm
    # issues it only to the publisher configured on the package: this
    # repository, this workflow file — see
    # https://docs.npmjs.com/trusted-publishers.
    permissions:
      id-token: write
    # No secret lives here now, but the environment stays: give it a required
    # reviewer and publishing a release becomes verify-everything, then wait
    # for a human before the irreversible upload.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@memco/memcoai/v/${{ needs.gate.outputs.version }}
    steps:
      # Exactly the artifact the build job verified.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist-nodejs
          path: dist
      # Trusted publishing needs npm >=11.5.1 to negotiate the OIDC exchange,
      # which the runner's own bundled npm cannot be relied on to have — Node
      # 24 is pinned because it ships one that does.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          # The -f test is not redundant: bash leaves an unmatched glob as its
          # own literal text, so with the artefact missing `$#` is 1 and `$1` is
          # the string `dist/*.tgz`. A count check alone would pass it straight
          # to `npm publish`, which then fails with an ENOENT that reads like a
          # registry problem rather than the empty download it is.
          set -- dist/*.tgz
          { [ "$#" -eq 1 ] && [ -f "$1" ]; } \
            || { echo "::error::expected one tarball, found $#: $*"; exit 1; }
          # npm has a dist-tag that PyPI has no equivalent of, and it defaults to
          # `latest`. A prerelease published without --tag would therefore become
          # what a plain `npm install @memco/memcoai` resolves to, for everyone.
          #
          # --access public because a *scoped* package publishes restricted by
          # default — a paid, org-only artefact nobody outside can install.
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; else dist_tag=latest; fi
          npm publish "$1" --access public --tag "$dist_tag"

  attach:
    name: Attach release artefacts
    needs: [gate, publish]
    runs-on: ubuntu-latest
    # The only job here that writes anything back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist-nodejs
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docs-nodejs
          path: docs

      # The <language>/<version>/ prefix is the same shape the Python pipeline
      # stages: it lets the docs site extract the tarball in place without
      # renaming anything, and every link inside the built reference is
      # relative, so it works from whatever path the site mounts it at.
      - name: Package the reference
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p "stage/nodejs/$VERSION"
          cp -r docs/. "stage/nodejs/$VERSION/"
          tar czf "memco-docs-nodejs-$VERSION.tar.gz" -C stage nodejs

      # The release already exists and is already published — that is what
      # triggered this run — so this only adds to it. `--clobber` makes a
      # re-run (say, after a transient failure here) overwrite rather than
      # error on assets a previous attempt already uploaded.
      - name: Attach the build artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # Both assets named in full, never globbed. npm's tarball ends in
          # `.tgz` and the documentation's in `.tar.gz`, so any glob loose
          # enough to catch both catches one of them twice, and any glob tight
          # enough to catch one silently drops the other.
          npm_tarball="dist/memco-memcoai-$VERSION.tgz"
          docs_tarball="memco-docs-nodejs-$VERSION.tar.gz"
          # Only the npm tarball is checked: it arrives from an artefact
          # download and can plausibly be absent or differently named, whereas
          # the docs tarball was written by the `tar czf` two steps up, which
          # would have failed the job already.
          [ -f "$npm_tarball" ] || {
            echo "::error::$npm_tarball is not among the artefacts"
            exit 1
          }
          gh release upload "$TAG" --clobber "$npm_tarball" "$docs_tarball"
