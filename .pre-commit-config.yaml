# Install once with:  pre-commit install
# Run over everything: pre-commit run --all-files
#
# Generated code is the export's to produce and is never reformatted here, so
# the hooks that would rewrite it exclude it individually. There is deliberately
# no top-level `exclude`: pre-commit applies that to the file list before a
# hook's own `files` is consulted, which would leave the provenance hook unable
# to fire on the very paths it exists to watch.

# Paths the export owns. Kept as an anchor so each hook can reuse it.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &generated '^(proto/|[a-z]+/client/|python/memco/memory/)'
      - id: end-of-file-fixer
        exclude: *generated
      - id: check-yaml
        exclude: *generated
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^python/
        exclude: *generated
      - id: ruff-format
        files: ^python/
        exclude: *generated

  # Run from the project's own environment so it sees the installed package and
  # the generated stubs, which an isolated hook environment would not.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd python && uv run mypy'
        language: system
        types: [python]
        files: ^python/
        pass_filenames: false

      - id: provenance
        name: generated client matches its contract
        entry: python3 scripts/verify_provenance.py
        language: system
        pass_filenames: false
        files: '^(proto/|[a-z]+/client/|python/memco/memory/|python/memco/SDK_PROVENANCE\.yaml|python/requirements\.txt|python/pyproject\.toml)'

      # The docstrings are where the service's tool copy lands, so they are a
      # generated artefact even though they are hand-editable. Fires on the
      # manifest and on the two modules it writes into.
      - id: tool-docs
        name: tool copy matches the manifest
        entry: python3 scripts/sync_tool_docs.py --check
        language: system
        pass_filenames: false
        files: '^(scripts/sync_tool_docs\.py|python/memco/(memory/tools\.json|operations\.py|types\.py))$'
