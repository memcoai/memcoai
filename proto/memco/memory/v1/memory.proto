syntax = "proto3";

package memco.memory.v1;

// go_package names the published SDK module, not the repository this contract
// is generated in: the option travels inside the serialized descriptor and so
// reaches every client, which must never be told the server's own repository.
option go_package = "github.com/memcoai/memco/go/client/memco/memory/v1;memoryv1";

// MemoryService is the shared memory surface: the eight operations a client
// uses to find knowledge, contribute to it, and rate what it was given.
//
// Every identifier crossing this boundary is an external handle a previous
// response issued — "session-<h>", "create-<h>", "memory-<h>-N" — never a row
// id. A handle addresses the memory domain it belongs to, which is why most
// operations take no domain of their own.
service MemoryService {
  // ListDomains returns the memory domains the caller may name. It takes no
  // domain itself: it is the answer to "which domain?".
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);

  // StartSession opens a session. Every search made under it is recorded as
  // one series, which is what relates the searches an agent runs for a task.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);

  // Search retrieves memories for a task-based query, recording the search
  // against a session so it can be rated afterwards.
  rpc Search(SearchRequest) returns (SearchResponse);

  // GetMemory returns the memory behind an idx a search delivered, including
  // one returned as a reference to an earlier search in the same session.
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);

  // CreateMemory saves new knowledge. It is accepted asynchronously, so the
  // response carries the operation id addressing the write rather than the
  // memory it will become.
  rpc CreateMemory(CreateMemoryRequest) returns (CreateMemoryResponse);

  // EnrichMemory adds to a memory a search returned, or opens a new one.
  rpc EnrichMemory(EnrichMemoryRequest) returns (EnrichMemoryResponse);

  // ShareFeedback rates the results of one search. Ratings are what move the
  // reliability signal on an insight.
  rpc ShareFeedback(ShareFeedbackRequest) returns (ShareFeedbackResponse);

  // RevertMemory undoes the caller's own write, addressed by the operation id
  // that write returned. Every outcome is a successful call: expired, refused
  // and not_found report a caller-visible state, not a service failure.
  rpc RevertMemory(RevertMemoryRequest) returns (RevertMemoryResponse);
}

// Instructions is the model-facing guidance accompanying a result, held apart
// from the data so a caller can render its own document or use this one. Each
// part arrives already rendered for its domain; a part with nothing to say is
// empty.
message Instructions {
  // content states what the result is, or what happened.
  string content = 1;
  // policy explains how a policy result outranks the rest. Present only when
  // one was returned.
  string policy = 2;
  // adding says how to contribute back to what came back.
  string adding = 3;
  // rating says how to rate what came back.
  string rating = 4;
  // next names the follow-up call this result enables, such as the handle that
  // undoes a write.
  string next = 5;
}

// Tag is one selector on a search or a write. The server lowercases each field
// and folds hyphens to underscores, so "Go" and "go" name the same tag.
//
// Which types exist, which of them narrow results rather than boost them, and
// which carry a version are per-domain: ListDomains describes them.
message Tag {
  // type is the tag's category, such as "language" or "framework". Required.
  string type = 1;
  // value is the value within that category, such as "go". Required.
  string value = 2;
  // version is the version of the thing named, where its type carries one — a
  // version on a type that does not is dropped. Optional, and absent is the
  // common case: most tag types carry no version at all.
  optional string version = 3;
}

// DomainEntry describes one memory domain: what it holds, when to draw on it,
// what belongs in it, and the tag vocabulary it uses.
message DomainEntry {
  // slug is the value a caller passes as the domain field.
  string slug = 1;
  string title = 2;
  string summary = 3;
  string when_to_search = 4;
  string when_to_save = 5;
  string what_not_to_save = 6;
  string tags_description = 7;
  // filter_tag_types name the tag types that narrow results rather than boost
  // them — the distinction deciding whether a wrong tag returns nothing.
  repeated string filter_tag_types = 8;
  // version_tag_types name the tag types that carry a version. A version on any
  // other type is dropped.
  repeated string version_tag_types = 9;
}

message ListDomainsRequest {}

message ListDomainsResponse {
  repeated DomainEntry domains = 1;
  Instructions instructions = 2;
}

message StartSessionRequest {
  // domain is required: a session belongs to one memory domain.
  string domain = 1;
}

message StartSessionResponse {
  string session_id = 1;
  Instructions instructions = 2;
}

message SearchRequest {
  // tags narrow or boost the results. Call ListDomains for the tag types a
  // domain uses and which of them filter rather than boost.
  repeated Tag tags = 1;
  // domain is required unless session_id is set, which supplies the domain of
  // the session it names.
  string domain = 2;
  // query is a task-based question, statement or task description.
  string query = 3;
  // session_id records this search under an open session. Omitting it opens a
  // new one, returned as session_id on the response.
  string session_id = 4;
}

message SearchResponse {
  string session_id = 1;
  // memories holds what was selected, in rendered order. A search that selected
  // nothing leaves it empty.
  repeated MemoryResult memories = 2;
  // notice is a remark about the query itself rather than about its results.
  string notice = 3;
  Instructions instructions = 4;
}

// MemoryResult is one memory a search returned, with the insights sampled from
// it.
message MemoryResult {
  string idx = 1;
  string kind = 2;
  // times_served counts this delivery along with the previous ones. It records
  // deliveries and nothing else — a frequently served result is not thereby a
  // correct one, which is what endorsed and disputed answer.
  int64 times_served = 3;
  // intents are the questions this memory has been retrieved by, oldest first.
  // They describe what it answers; none of them is "the one that matched",
  // since a memory is retrieved whole.
  repeated string intents = 4;
  repeated InsightResult insights = 5;
  // reference names the idx an earlier search in this session returned this
  // memory under. An entry carrying one carries no insights: the memory is
  // already in the caller's context under that idx, and GetMemory returns it
  // again for a caller that never saw it.
  string reference = 6;
}

// InsightResult is one insight held under its memory.
message InsightResult {
  string idx = 1;
  string title = 2;
  string content = 3;
  // updated is the day the insight was last written, as YYYY-MM-DD. Enrichment
  // edits an insight in place, so it is the age of the knowledge rather than of
  // the record.
  string updated = 4;
  int64 times_served = 5;
  // endorsed and disputed are what ShareFeedback has recorded about this
  // insight — the reliability signal times_served is not.
  int64 endorsed = 6;
  int64 disputed = 7;
}

message GetMemoryRequest {
  // idx is copied exactly as it appeared in a search response. An insight's idx
  // returns the memory holding it.
  string idx = 1;
}

message GetMemoryResponse {
  MemoryResult memory = 1;
}

// DataSource names who produced the content. The operator source is written
// only by the memory operators and is deliberately absent: it is not a value a
// caller may claim.
enum DataSource {
  // DATA_SOURCE_UNSPECIFIED is read as DATA_SOURCE_AGENT.
  DATA_SOURCE_UNSPECIFIED = 0;
  DATA_SOURCE_USER = 1;
  DATA_SOURCE_AGENT = 2;
}

message CreateMemoryRequest {
  repeated Tag tags = 1;
  DataSource source = 2;
  // domain is required unless session_id is set.
  string domain = 3;
  // session_id names the session this memory was learned during.
  string session_id = 4;
  // query describes what someone would search to find this memory.
  string query = 5;
  string title = 6;
  string content = 7;
}

message CreateMemoryResponse {
  // operation_id addresses the write, for RevertMemory. It is empty when none
  // could be minted: the content is worth more than the ability to undo it, so
  // numbering failure degrades to an un-revertible write rather than a
  // rejected one.
  string operation_id = 1;
  Instructions instructions = 2;
}

message EnrichMemoryRequest {
  repeated Tag tags = 1;
  DataSource source = 2;
  string title = 3;
  string content = 4;
  // sources name the memories this addition draws on.
  repeated string sources = 5;
  // session_id is required: the memory being enriched was returned by a search
  // under it, and the session supplies the domain.
  string session_id = 6;
  // memory_idx is the memory to enrich, or "new" to open one.
  string memory_idx = 7;
}

message EnrichMemoryResponse {
  string operation_id = 1;
  Instructions instructions = 2;
}

message ShareFeedbackRequest {
  // feedback holds one rating per result being rated.
  repeated FeedbackRating feedback = 1;
  // session_id is the search being rated. It supplies the domain.
  string session_id = 2;
}

// FeedbackRating is one rating a caller gives a result.
message FeedbackRating {
  // idx is copied exactly as it appeared in a search response, and cannot be
  // constructed by hand. An insight's idx rates that insight; a memory's own
  // idx rates every insight under it. Required.
  string idx = 1;
  // relevant reports whether the result was a good match for the query.
  bool relevant = 2;
  // correct reports whether its content was accurate.
  bool correct = 3;
  // comment is an optional note about this result.
  optional string comment = 4;
}

message ShareFeedbackResponse {
  string session_id = 1;
  repeated FeedbackEntry entries = 2;
  Instructions instructions = 3;
}

// FeedbackEntry is one rating that was recorded.
message FeedbackEntry {
  string idx = 1;
  bool relevant = 2;
  bool correct = 3;
  // advice is the suggestion this particular verdict earned, empty when the
  // verdict suggests nothing. It addresses one result, so it belongs to the
  // entry rather than to the batch.
  string advice = 4;
}

// RevertOutcome reports what a revert actually removed, so the caller is told
// what happened rather than what it had asked for. It names the effect, not the
// originating operation.
enum RevertOutcome {
  REVERT_OUTCOME_UNSPECIFIED = 0;
  // The reverted insight was its memory's last, so the memory and its orphaned
  // intents went with it.
  REVERT_OUTCOME_MEMORY_REMOVED = 1;
  // Only the caller's insight was removed — its memory holds others and stays.
  REVERT_OUTCOME_ADDITION_REMOVED = 2;
  // The caller's insight was removed and no memory was involved either way — a
  // write the validator rejected never reaches one.
  REVERT_OUTCOME_ENTRY_REMOVED = 3;
  // The operation was folded into an existing insight as an endorsement rather
  // than added as new. The caller's duplicate was removed; the endorsed insight
  // is untouched.
  REVERT_OUTCOME_MERGED = 4;
  // No write by this caller carries the operation id — either it never existed
  // or its ingestion has not completed yet.
  REVERT_OUTCOME_NOT_FOUND = 5;
  // The operation is older than the revert window.
  REVERT_OUTCOME_EXPIRED = 6;
  // The content is under moderation and only a moderator may remove it.
  REVERT_OUTCOME_REFUSED = 7;
}

message RevertMemoryRequest {
  // op_id is the operation id CreateMemory or EnrichMemory returned.
  string op_id = 1;
}

message RevertMemoryResponse {
  string operation_id = 1;
  RevertOutcome outcome = 2;
  Instructions instructions = 3;
}
